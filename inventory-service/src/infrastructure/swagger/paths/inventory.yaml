/api/v1/inventory:
  post:
    tags:
      - Inventory
    summary: Create inventory for a product
    description: Creates inventory record for a product. Validates product existence with products service.
    security:
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryInput'
    responses:
      '201':
        description: Inventory created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Inventory'
      '400':
        description: Bad request - validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized - invalid or missing API key
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Product not found in products service
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '503':
        description: Products service unavailable
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '504':
        description: Gateway timeout - products service did not respond
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/v1/inventory/{productId}:
  get:
    tags:
      - Inventory
    summary: Get inventory by product ID
    description: Retrieves inventory for a specific product. Validates product existence with products service.
    security:
      - ApiKeyAuth: []
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          format: uuid
        description: Product ID
    responses:
      '200':
        description: Inventory found
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Inventory'
      '404':
        description: Product or inventory not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '503':
        description: Products service unavailable
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '504':
        description: Gateway timeout
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  patch:
    tags:
      - Inventory
    summary: Update inventory quantity
    description: Updates the quantity for a product's inventory. Emits inventory.updated event.
    security:
      - ApiKeyAuth: []
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
          format: uuid
        description: Product ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryUpdate'
    responses:
      '200':
        description: Inventory updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Inventory'
      '400':
        description: Bad request - validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: Product or inventory not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '503':
        description: Products service unavailable
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '504':
        description: Gateway timeout
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/health:
  get:
    tags:
      - Health
    summary: Health check
    description: Returns the health status of the service
    security: []
    responses:
      '200':
        description: Service is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: ok
                service:
                  type: string
                  example: inventory-service
